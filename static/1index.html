<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iTalk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .pressable { -webkit-tap-highlight-color: transparent; }
    .line-clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-max { max-width: 8em; }
    .icon-btn { width: 2.25rem; height: 2.25rem; display: inline-flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 safe-top">
  <div class="mx-auto w-full max-w-[56rem] px-2 md:px-4 pb-24">
    <!-- Top bar -->
    <div class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800">
      <div class="py-2 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="text-base font-semibold">iTalk</div>
          <div class="text-[11px] text-slate-400 line-clamp-1" id="statusMini"></div>
        </div>
        <select id="voiceSelect" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          <option>alba</option>
        </select>
      </div>

      <!-- Tabs -->
      <div class="grid grid-cols-3 gap-1 pb-2">
        <button class="pressable tabBtn bg-slate-900 border border-slate-700 rounded py-1.5 text-sm font-medium text-slate-200" data-tab="chat">💬 Chat</button>
        <button class="pressable tabBtn bg-slate-900 border border-slate-700 rounded py-1.5 text-sm font-medium text-slate-200" data-tab="favorites">⭐ Favorites</button>
        <button class="pressable tabBtn bg-slate-900 border border-slate-700 rounded py-1.5 text-sm font-medium text-slate-200" data-tab="history">🕘 History</button>
      </div>
    </div>

    <!-- Chat tab -->
    <div id="tab-chat" class="tabPanel pt-2 space-y-2">
      <!-- Text area -->
      <div class="bg-slate-900 border border-slate-800 rounded p-2">
        <textarea id="textInput" rows="4" class="w-full bg-transparent outline-none resize-none text-base" placeholder="Enter text to speak"></textarea>
        <div class="pt-1 text-[11px] text-slate-400 flex items-center justify-between">
          <div id="editingHint"></div>
          <div><span id="charCount">0</span></div>
        </div>
      </div>

      <!-- Toolbar (one line) -->
      <div class="flex flex-nowrap gap-1 items-stretch">
        <button id="btnSpeak" class="pressable flex-1 inline-flex items-center justify-center gap-1 bg-emerald-600 active:bg-emerald-700 rounded px-2 py-2 text-sm font-semibold">
          <span class="inline-flex items-center gap-1">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/><path d="M17.8 6.2a7 7 0 0 1 0 11.6"/></svg>
            Speak
          </span>
        </button>
        <button id="btnFav" class="pressable inline-flex items-center justify-center gap-1 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm font-medium">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.3 1.2-7-5-4.8 7-1 3-6.3 3 6.3 7 1-5 4.8 1.2 7z"/></svg>
          Fav
        </button>
        <button id="btnTag" class="pressable inline-flex items-center justify-center gap-1 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm font-medium">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10V4H14L4 14l6 6 10-10z"/><path d="M7 17l-1.5-1.5"/><path d="M16 8h.01"/></svg>
          Tag
        </button>
        <button id="btnClear" class="pressable bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm font-medium">Clear</button>
        <button id="btnCopy" class="pressable icon-btn bg-slate-900 border border-slate-700 rounded" title="Copy" aria-label="Copy">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><rect x="2" y="2" width="13" height="13" rx="2"/></svg>
        </button>
        <button id="btnPaste" class="pressable icon-btn bg-slate-900 border border-slate-700 rounded" title="Paste" aria-label="Paste">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2h6"/>
            <path d="M10 4h4"/>
            <path d="M8 4h8a2 2 0 0 1 2 2v16H6V6a2 2 0 0 1 2-2Z"/>
            <path d="M10 10h6"/>
            <path d="M10 14h6"/>
            <path d="M10 18h6"/>
          </svg>
        </button>
      </div>

      <!-- Tag cloud -->
      <div class="bg-slate-900 border border-slate-800 rounded p-2">
        <div class="text-[11px] text-slate-400 pb-1">Tags</div>
        <div id="tagCloud" class="flex flex-wrap gap-1"></div>
      </div>

      <!-- Session log -->
      <div class="bg-slate-900 border border-slate-800 rounded p-2">
        <div class="flex items-center justify-between pb-1">
          <div class="text-sm font-semibold">Session</div>
          <button id="btnClearSession" class="pressable text-[11px] text-slate-200 bg-slate-800 border border-slate-700 px-2 py-1 rounded">Clear</button>
        </div>
        <div id="sessionLog" class="space-y-1"></div>
      </div>

      <!-- Session footer -->
      <div class="bg-slate-900 border border-slate-800 rounded p-2 space-y-2 safe-bottom">
        <input id="sessionName" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 outline-none text-sm" placeholder="Session name (Call to Frontier)" />
        <div class="grid grid-cols-2 gap-1">
          <button id="btnNewSession" class="pressable bg-slate-800 border border-slate-700 rounded py-2 text-sm font-medium">New</button>
          <button id="btnSaveSession" class="pressable bg-indigo-600 active:bg-indigo-700 rounded py-2 text-sm font-semibold">Save</button>
        </div>
      </div>
    </div>

    <!-- Favorites tab -->
    <div id="tab-favorites" class="tabPanel hidden pt-2 space-y-2">
      <div class="bg-slate-900 border border-slate-800 rounded p-2">
        <div id="favoritesList" class="space-y-3"></div>
      </div>
    </div>

    <!-- History tab -->
    <div id="tab-history" class="tabPanel hidden pt-2 space-y-2">
      <div class="bg-slate-900 border border-slate-800 rounded p-2">
        <div id="historyList" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <!-- Floating stop -->
  <button id="floatingStop" class="hidden pressable fixed bottom-4 right-4 safe-bottom bg-red-600 active:bg-red-700 shadow-lg rounded-full w-14 h-14 text-lg font-bold z-50" aria-label="Stop">
    ⏹
  </button>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/60"></div>
    <div class="absolute inset-x-2 top-16 mx-auto w-full max-w-[56rem] bg-slate-900 border border-slate-700 rounded p-3 shadow-xl">
      <div class="flex items-center justify-between pb-2">
        <div id="modalTitle" class="text-sm font-semibold"></div>
        <button id="modalClose" class="pressable text-slate-200 bg-slate-800 border border-slate-700 px-2 py-1 rounded text-sm">Close</button>
      </div>
      <div id="modalBody"></div>
      <div class="pt-3 flex justify-end gap-2">
        <button id="modalCancel" class="pressable bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm">Cancel</button>
        <button id="modalOk" class="pressable bg-indigo-600 active:bg-indigo-700 rounded px-3 py-2 text-sm font-semibold">OK</button>
      </div>
    </div>
  </div>

<script>
  const API = {
    state: "/italk/state",
    setVoice: "/italk/settings/voice",
    addTag: "/italk/tags",
    updateTag: (id) => `/italk/tags/${encodeURIComponent(id)}`,
    deleteTag: (id) => `/italk/tags/${encodeURIComponent(id)}`,
    addFav: "/italk/favorites",
    updateFav: (id) => `/italk/favorites/${encodeURIComponent(id)}`,
    deleteFav: (id) => `/italk/favorites/${encodeURIComponent(id)}`,
    reorderFav: "/italk/favorites/reorder",
    setSessionName: "/italk/session/name",
    newSession: "/italk/session/new",
    clearSession: "/italk/session/clear",
    saveSession: "/italk/session/save",
    appendLine: "/italk/session/append_line",
    deleteHistorySession: "/italk/history/delete",
    deleteHistoryLine: "/italk/history/delete_line",
    deleteSessionLine: "/italk/session/delete_line",
  };

  const $ = (id) => document.getElementById(id);

  function clampText(s) {
    return (s || "").trim().replace(/\r?\n/g, " ");
  }

  async function jsonFetch(url, method, bodyObj) {
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: bodyObj ? JSON.stringify(bodyObj) : undefined,
    });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).detail || msg; } catch {}
      throw new Error(msg);
    }
    return await res.json();
  }


  function isClipboardAvailable() {
    return !!(navigator.clipboard && window.isSecureContext);
  }

  async function clipboardWrite(text) {
    const t = String(text ?? "");
    if (isClipboardAvailable()) {
      await navigator.clipboard.writeText(t);
      return true;
    }
    // Fallback for HTTP / file:// contexts
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (!ok) throw new Error("Copy not allowed");
    return true;
  }

  async function clipboardRead() {
    if (isClipboardAvailable()) {
      return await navigator.clipboard.readText();
    }
    // Fallback: ask user (works everywhere)
    const t = prompt("Paste text here:");
    return t ?? "";
  }

  function focusTextInput() {
    const el = $("textInput");
    if (!el) return;
    el.focus();
    // place cursor at end
    try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
  }


  function toast(msg) {
    $("statusMini").textContent = msg;
    setTimeout(() => {
      if ($("statusMini").textContent === msg) $("statusMini").textContent = "";
    }, 1600);
  }

  // Streaming WAV player
  class StreamingWavPlayer {
    constructor({ onComplete, onCancel }) {
      this.audioContext = StreamingWavPlayer.sharedContext();
      this.sampleRate = 0;
      this.numChannels = 0;
      this.headerParsed = false;
      this.headerBuffer = new Uint8Array(44);
      this.headerBytesReceived = 0;
      this.minBufferSize = 16384;
      this.pcmData = new Uint8Array(0);
      this.nextStartTime = 0;
      this.pendingSources = 0;
      this.streamEnded = false;
      this.stopped = false;
      this.onComplete = onComplete;
      this.onCancel = onCancel;
      this._finishTimer = null;
    }

    static sharedContext() {
      if (!StreamingWavPlayer._ctx) {
        StreamingWavPlayer._ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "playback" });
      }
      return StreamingWavPlayer._ctx;
    }

    parseWavHeader(header) {
      const view = new DataView(header.buffer);
      const riff = String.fromCharCode(...header.slice(0,4));
      const wave = String.fromCharCode(...header.slice(8,12));
      if (riff !== "RIFF" || wave !== "WAVE") throw new Error("Invalid WAV");
      this.numChannels = view.getUint16(22, true);
      this.sampleRate = view.getUint32(24, true);
      this.headerParsed = true;
    }

    appendPcmData(newData) {
      const newBuffer = new Uint8Array(this.pcmData.length + newData.length);
      newBuffer.set(this.pcmData);
      newBuffer.set(newData, this.pcmData.length);
      this.pcmData = newBuffer;
    }

    _maybeFinish() {
      if (this.stopped) return;
      if (!this.streamEnded) return;
      // If the stream ended but we have a partial trailing frame (not enough bytes
      // for even one sample across all channels), discard it so completion can fire.
      if (this.headerParsed && this.numChannels > 0) {
        const bytesPerFrame = this.numChannels * 2;
        if (this.pcmData.length > 0 && this.pcmData.length < bytesPerFrame) {
          this.pcmData = new Uint8Array(0);
        }
      }
      if (this.pendingSources > 0) return;
      if (this.pcmData.length > 0) return;

      // give the audio graph a beat to settle
      if (this._finishTimer) clearTimeout(this._finishTimer);
      this._finishTimer = setTimeout(() => {
        if (this.stopped) return;
        if (this.onComplete) this.onComplete();
      }, 80);
    }

    async tryPlayBuffer() {
      if (this.stopped) return;
      if (!this.headerParsed || this.pcmData.length < this.minBufferSize) return;

      const bytesPerFrame = this.numChannels * 2;
      const framesToPlay = Math.floor(this.pcmData.length / bytesPerFrame);
      const bytesToPlay = framesToPlay * bytesPerFrame;
      if (bytesToPlay <= 0) return;

      const dataToPlay = this.pcmData.slice(0, bytesToPlay);
      this.pcmData = this.pcmData.slice(bytesToPlay);

      const audioBuffer = this.audioContext.createBuffer(this.numChannels, framesToPlay, this.sampleRate);
      const int16Data = new Int16Array(dataToPlay.buffer, dataToPlay.byteOffset, framesToPlay * this.numChannels);
      for (let ch = 0; ch < this.numChannels; ch++) {
        const chData = audioBuffer.getChannelData(ch);
        for (let i = 0; i < framesToPlay; i++) chData[i] = int16Data[i * this.numChannels + ch] / 32768;
      }

      const source = this.audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(this.audioContext.destination);

      const currentTime = this.audioContext.currentTime;
      const startTime = Math.max(currentTime, this.nextStartTime);

      this.pendingSources += 1;
      source.onended = () => {
        this.pendingSources = Math.max(0, this.pendingSources - 1);
        this._maybeFinish();
      };

      source.start(startTime);
      this.nextStartTime = startTime + audioBuffer.duration;

      if (this.pcmData.length >= this.minBufferSize) setTimeout(() => this.tryPlayBuffer(), 10);
      this._maybeFinish();
    }

    addChunk(chunk) {
      if (this.stopped) return;
      if (!this.headerParsed) {
        const need = 44 - this.headerBytesReceived;
        const toCopy = Math.min(need, chunk.length);
        this.headerBuffer.set(chunk.slice(0, toCopy), this.headerBytesReceived);
        this.headerBytesReceived += toCopy;
        if (this.headerBytesReceived >= 44) {
          this.parseWavHeader(this.headerBuffer);
          if (chunk.length > toCopy) this.appendPcmData(chunk.slice(toCopy));
        }
      } else {
        this.appendPcmData(chunk);
      }
      this.tryPlayBuffer();
    }

    endStream() {
      this.streamEnded = true;
      if (this.pcmData.length > 0) {
        this.minBufferSize = 1;
        this.tryPlayBuffer();
      }
      this._maybeFinish();
    }

    stop() {
      if (this.stopped) return;
      this.stopped = true;
      if (this._finishTimer) clearTimeout(this._finishTimer);
      try { this.audioContext.close(); } catch {}
      StreamingWavPlayer._ctx = null;
      if (this.onCancel) this.onCancel();
    }
  }

  const state = {
    tags: [],
    favorites: { categories: {} },
    last_session: { name: "", lines: [] },
    history: [],
    historyExpanded: new Set(),
    favoriteExpanded: new Set(),
    editingFavoriteId: null,
    editingFavoriteCategory: null,
    isPlaying: false,
    abortController: null,
    player: null,
    lastSpeakText: "",
  };

  async function loadVoices() {
    try {
      const r = await fetch("/voices");
      const data = await r.json();
      const sel = $("voiceSelect");
      sel.innerHTML = "";
      data.voices.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
    } catch (e) { console.error(e); }
  }

  async function loadState() {
    const r = await fetch(API.state);
    const data = await r.json();
    state.tags = data.tags || [];
    state.favorites = data.favorites || { categories: {} };
    // default: expand all favorite categories
    state.favoriteExpanded = new Set(Object.keys(state.favorites.categories || {}));
    state.last_session = data.last_session || { name: "", lines: [] };
    state.history = data.history || [];
    if (data.settings && data.settings.last_voice) $("voiceSelect").value = data.settings.last_voice;
    $("sessionName").value = state.last_session.name || "";
    renderAll();
  }

  function renderAll() {
    renderTags();
    renderSessionLog();
    renderFavorites();
    renderHistory();
    renderEditingHint();
  }

  function renderEditingHint() {
    const hint = $("editingHint");
    if (state.editingFavoriteId) {
      hint.textContent = "Editing favorite";
      hint.className = "text-xs text-amber-400";
    } else {
      hint.textContent = "";
      hint.className = "text-xs text-slate-400";
    }
  }

  function setTab(name) {
    ["chat","favorites","history"].forEach(t => {
      $("tab-" + t).classList.toggle("hidden", t !== name);
    });
    document.querySelectorAll(".tabBtn").forEach(btn => {
      const active = btn.dataset.tab === name;
      btn.classList.toggle("bg-indigo-700", active);
      btn.classList.toggle("border-indigo-500", active);
      btn.classList.toggle("text-white", active);
      btn.classList.toggle("shadow", active);
      btn.classList.toggle("bg-slate-900", !active);
      btn.classList.toggle("border-slate-700", !active);
      btn.classList.toggle("text-slate-200", !active);
    });
  }

  document.querySelectorAll(".tabBtn").forEach(btn => btn.addEventListener("click", () => setTab(btn.dataset.tab)));

  function showModal({ title, bodyNode, okText = "OK", cancelText = "Cancel", onOk, onCancel }) {
    $("modalTitle").textContent = title;
    const body = $("modalBody");
    body.innerHTML = "";
    body.appendChild(bodyNode);
    $("modalOk").textContent = okText;
    $("modalCancel").textContent = cancelText;

    function close() {
      $("modal").classList.add("hidden");
      $("modalOk").onclick = null;
      $("modalCancel").onclick = null;
      $("modalClose").onclick = null;
    }

    $("modal").classList.remove("hidden");
    $("modalOk").onclick = async () => { const res = await onOk?.(); if (res !== false) close(); };
    $("modalCancel").onclick = () => { onCancel?.(); close(); };
    $("modalClose").onclick = () => { onCancel?.(); close(); };
  }

  function renderTags() {
    const cloud = $("tagCloud");
    cloud.innerHTML = "";

    state.tags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "pressable tag-max line-clamp-1 bg-slate-800 border border-slate-700 active:bg-slate-600 rounded px-2 py-1.5 text-sm";
      btn.textContent = tag.label;
      btn.title = tag.text;
      btn.addEventListener("click", () => speakText(tag.text, { source: "tag" }));

      let pressTimer = null;
      const start = async () => {
        pressTimer = setTimeout(async () => {
          try { await clipboardWrite(tag.text); } catch {}
          const d = document.createElement("div");
          d.className = "text-sm text-slate-200";
          d.innerHTML = `<div class="pb-2">Copied tag text to clipboard.</div><div class="text-slate-400">${tag.label}</div>`;
          showModal({
            title: "Delete tag",
            bodyNode: d,
            okText: "Delete",
            cancelText: "Keep",
            onOk: async () => {
              await fetch(API.deleteTag(tag.id), { method: "DELETE" });
              state.tags = state.tags.filter(t => t.id !== tag.id);
              renderTags();
              toast("Tag deleted");
            }
          });
        }, 650);
      };
      const cancel = () => { if (pressTimer) clearTimeout(pressTimer); pressTimer = null; };
      btn.addEventListener("touchstart", start, { passive: true });
      btn.addEventListener("touchend", cancel);
      btn.addEventListener("touchmove", cancel);
      btn.addEventListener("mousedown", start);
      btn.addEventListener("mouseup", cancel);
      btn.addEventListener("mouseleave", cancel);

      cloud.appendChild(btn);
    });
  }

  async function addTagFromText() {
    const full = $("textInput").value.trim();
    if (!full) return toast("Type something first");

    const node = document.createElement("div");
    node.className = "space-y-3";
    node.innerHTML = `
      <div class="text-sm text-slate-300">Label (shows on button)</div>
      <input id="tagLabel" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 outline-none" />
      <div class="text-sm text-slate-300">Text (spoken)</div>
      <textarea id="tagText" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 outline-none resize-none"></textarea>
    `;

    showModal({
      title: "Create tag",
      bodyNode: node,
      okText: "Save",
      onOk: async () => {
        const label = node.querySelector("#tagLabel").value.trim() || full.slice(0, 12);
        const text = node.querySelector("#tagText").value.trim() || full;
        const tag = await jsonFetch(API.addTag, "POST", { label, text });
        state.tags.push({ id: tag.id, label, text });
        renderTags();
        toast("Tag saved");
      }
    });

    node.querySelector("#tagLabel").value = full.slice(0, 8);
    node.querySelector("#tagText").value = full;
    node.querySelector("#tagLabel").focus();
  }

  function makeLineRow({ text, buttons }) {
    const row = document.createElement("div");
    row.className = "flex items-center gap-1 bg-slate-950/30 border border-slate-800 rounded px-2 py-1";

    const left = document.createElement("div");
    left.className = "flex-1 min-w-0";
    left.innerHTML = `<div class="text-sm line-clamp-1">${clampText(text)}</div>`;

    const right = document.createElement("div");
    right.className = "flex items-center gap-1";

    buttons.forEach(b => right.appendChild(b));

    row.appendChild(left);
    row.appendChild(right);
    return row;
  }

  function iconButton({ title, svg, onClick }) {
    const btn = document.createElement("button");
    btn.className = "pressable icon-btn bg-slate-900 border border-slate-700 rounded";
    btn.title = title;
    btn.innerHTML = svg;
    btn.addEventListener("click", (e) => { e.stopPropagation(); onClick?.(); });
    return btn;
  }

  function speakButton({ onClick }) {
    const btn = document.createElement("button");
    btn.className = "pressable inline-flex items-center gap-1 bg-emerald-700 active:bg-emerald-800 text-white border border-emerald-900 rounded px-2 py-1 text-xs font-semibold";
    btn.innerHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/></svg>Speak`;
    btn.addEventListener("click", (e) => { e.stopPropagation(); onClick?.(); });
    return btn;
  }

  function renderSessionLog() {
    const log = $("sessionLog");
    log.innerHTML = "";
    const lines = state.last_session.lines || [];
    if (lines.length === 0) {
      log.innerHTML = `<div class="text-sm text-slate-400">No lines yet.</div>`;
      return;
    }

    lines.forEach((line) => {
      const btnSpeak = speakButton({ onClick: () => speakText(line.text, { source: "log" }) });

      const btnFav = iconButton({
        title: "Favorite",
        svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.3 1.2-7-5-4.8 7-1 3-6.3 3 6.3 7 1-5 4.8 1.2 7z"/></svg>`,
        onClick: () => addFavoriteFromText(line.text)
      });

      const btnEdit = iconButton({
        title: "Edit",
        svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
        onClick: () => { $("textInput").value = line.text; updateCharCount(); setTab("chat"); focusTextInput(); }
      });

      const btnDel = iconButton({
        title: "Delete",
        svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
        onClick: async () => {
          try {
            await jsonFetch(API.deleteSessionLine, "POST", { id: line.id });
          } catch (e) { console.error(e); }
          state.last_session.lines = state.last_session.lines.filter(x => x.id !== line.id);
          renderSessionLog();
        }});

      const row = makeLineRow({ text: line.text, buttons: [btnSpeak, btnFav, btnEdit, btnDel] });
      log.appendChild(row);
    });
  }

  function beginEditFavorite(favId, cat, text) {
    state.editingFavoriteId = favId;
    state.editingFavoriteCategory = cat;
    $("textInput").value = text;
    updateCharCount();
    renderEditingHint();
    setTab("chat");
    $("textInput").focus();
  }

  async function addFavoriteFromText(textOverride) {
    const full = (textOverride ?? $("textInput").value).trim();
    if (!full) return toast("Type something first");

    const categories = Object.keys(state.favorites.categories || {});

    const node = document.createElement("div");
    node.className = "space-y-3";

    const sel = document.createElement("select");
    sel.className = "w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 outline-none";
    categories.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      sel.appendChild(opt);
    });

    const newCat = document.createElement("input");
    newCat.className = "w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 outline-none";
    newCat.placeholder = "New category (optional)";

    const txt = document.createElement("textarea");
    txt.rows = 4;
    txt.className = "w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 outline-none resize-none";
    txt.value = full;

    node.appendChild(Object.assign(document.createElement("div"), { className: "text-sm text-slate-300", textContent: "Category" }));
    node.appendChild(sel);
    node.appendChild(newCat);
    node.appendChild(Object.assign(document.createElement("div"), { className: "text-sm text-slate-300", textContent: "Text" }));
    node.appendChild(txt);

    const isEdit = !!state.editingFavoriteId;

    showModal({
      title: isEdit ? "Update favorite" : "Add favorite",
      bodyNode: node,
      okText: "Save",
      onOk: async () => {
        const cat = (newCat.value.trim() || sel.value || "Unsorted").trim();
        const text = txt.value.trim();
        if (!text) return false;

        if (state.editingFavoriteId) {
          await jsonFetch(API.updateFav(state.editingFavoriteId), "PUT", { category: cat, text });
          // local update
          const cats = state.favorites.categories;
          // remove old
          Object.keys(cats).forEach(k => cats[k] = (cats[k] || []).filter(f => f.id !== state.editingFavoriteId));
          cats[cat] = cats[cat] || [];
          cats[cat].push({ id: state.editingFavoriteId, text });
          state.editingFavoriteId = null;
          state.editingFavoriteCategory = null;
          renderEditingHint();
          toast("Favorite updated");
        } else {
          const res = await jsonFetch(API.addFav, "POST", { category: cat, text });
          state.favorites.categories[cat] = state.favorites.categories[cat] || [];
          state.favorites.categories[cat].push({ id: res.id, text });
          toast("Favorite saved");
        }

        renderFavorites();
      }
    });
  }

  async function deleteFavorite(favId) {
    await fetch(API.deleteFav(favId), { method: "DELETE" });
    const cats = state.favorites.categories;
    Object.keys(cats).forEach(cat => cats[cat] = (cats[cat] || []).filter(f => f.id !== favId));
    renderFavorites();
    toast("Favorite deleted");
  }

  async function moveFavorite(cat, favId, dir) {
    const items = state.favorites.categories[cat] || [];
    const idx = items.findIndex(x => x.id === favId);
    if (idx < 0) return;
    const to = idx + dir;
    if (to < 0 || to >= items.length) return;

    await jsonFetch(API.reorderFav, "POST", { category: cat, from: idx, to });
    const [sp] = items.splice(idx, 1);
    items.splice(to, 0, sp);
    renderFavorites();
  }

  function renderFavorites() {
    const root = $("favoritesList");
    root.innerHTML = "";

    const cats = state.favorites.categories || {};
    const catNames = Object.keys(cats);
    if (catNames.length === 0) {
      root.innerHTML = `<div class="text-sm text-slate-400">No favorites yet.</div>`;
      return;
    }

    catNames.forEach(cat => {
      const section = document.createElement("div");
      section.className = "space-y-2";

      const catHeader = document.createElement("div");
      catHeader.className = "flex items-center justify-between gap-2";

      const catLeft = document.createElement("button");
      catLeft.className = "pressable flex-1 text-left text-xs uppercase tracking-wide text-slate-400";
      catLeft.textContent = cat;

      const catExpanded = state.favoriteExpanded.has(cat);
      const catToggle = iconButton({
        title: catExpanded ? "Collapse" : "Expand",
        svg: catExpanded
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`,
        onClick: () => {
          if (state.favoriteExpanded.has(cat)) state.favoriteExpanded.delete(cat);
          else state.favoriteExpanded.add(cat);
          renderFavorites();
        }
      });

      catLeft.addEventListener("click", () => {
        if (state.favoriteExpanded.has(cat)) state.favoriteExpanded.delete(cat);
        else state.favoriteExpanded.add(cat);
        renderFavorites();
      });

      catHeader.appendChild(catLeft);
      catHeader.appendChild(catToggle);
      section.appendChild(catHeader);

      if (!state.favoriteExpanded.has(cat)) {
        root.appendChild(section);
        return;
      }

      (cats[cat] || []).forEach(fav => {
        const btnSpeak = speakButton({ onClick: () => speakText(fav.text, { source: "favorite" }) });
        const btnUp = iconButton({
          title: "Move up",
          svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>`,
          onClick: () => moveFavorite(cat, fav.id, -1)
        });
        const btnDown = iconButton({
          title: "Move down",
          svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`,
          onClick: () => moveFavorite(cat, fav.id, +1)
        });
        const btnEdit = iconButton({
          title: "Edit",
          svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
          onClick: () => beginEditFavorite(fav.id, cat, fav.text)
        });
        const btnDel = iconButton({
          title: "Delete",
          svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
          onClick: () => deleteFavorite(fav.id)
        });

        section.appendChild(makeLineRow({ text: fav.text, buttons: [btnSpeak, btnUp, btnDown, btnEdit, btnDel] }));
      });

      root.appendChild(section);
    });
  }

  function renderHistory() {
    const root = $("historyList");
    root.innerHTML = "";

    if (!state.history || state.history.length === 0) {
      root.innerHTML = `<div class="text-sm text-slate-400">No saved sessions yet.</div>`;
      return;
    }

    // newest first
    const sessions = [...state.history].slice().reverse();

    sessions.forEach(sess => {
      const expanded = state.historyExpanded.has(sess.id) || false;

      const header = document.createElement("div");
      header.className = "flex items-center justify-between gap-2";

      const left = document.createElement("button");
      left.className = "pressable flex-1 min-w-0 text-left";
      left.innerHTML = `
        <div class="text-sm font-semibold line-clamp-1">${sess.name || "(no name)"}</div>
        <div class="text-[11px] text-slate-400">${sess.saved_at || ""}</div>
      `;

      const toggleBtn = iconButton({
        title: expanded ? "Collapse" : "Expand",
        svg: expanded
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`,
        onClick: () => {
          if (state.historyExpanded.has(sess.id)) {
            state.historyExpanded.clear();
          } else {
            state.historyExpanded = new Set([sess.id]);
          }
          renderHistory();
        }
      });

      const deleteBtn = iconButton({
        title: "Delete session",
        svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`,
        onClick: () => {
          const d = document.createElement("div");
          d.className = "text-sm text-slate-200";
          d.innerHTML = `<div class="pb-2">Delete this saved session?</div><div class="text-slate-400">${sess.name || "(no name)"}</div>`;
          showModal({
            title: "Delete history session",
            bodyNode: d,
            okText: "Delete",
            cancelText: "Keep",
            onOk: async () => {
              await jsonFetch(API.deleteHistorySession, "POST", { id: sess.id });
              state.history = state.history.filter(x => x.id !== sess.id);
              state.historyExpanded.delete(sess.id);
              renderHistory();
              toast("Session deleted");
            }
          });
        }
      });

      left.addEventListener("click", () => {
        if (state.historyExpanded.has(sess.id)) {
          state.historyExpanded.clear();
        } else {
          state.historyExpanded = new Set([sess.id]);
        }
        renderHistory();
      });

      header.appendChild(left);
      header.appendChild(toggleBtn);
      header.appendChild(deleteBtn);

      const box = document.createElement("div");
      box.className = "bg-slate-950/30 border border-slate-800 rounded p-2 space-y-2";
      box.appendChild(header);

      if (expanded) {
        const lines = (sess.lines || []).slice().reverse();
        const list = document.createElement("div");
        list.className = "space-y-1 pt-1";

        lines.forEach(line => {
          const btnSpeak = speakButton({ onClick: () => speakText(line.text, { source: "history" }) });
          const btnEdit = iconButton({
            title: "Edit",
            svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
            onClick: () => { $("textInput").value = line.text; updateCharCount(); setTab("chat"); focusTextInput(); }
          });
          const btnDel = iconButton({
            title: "Delete",
            svg: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
            onClick: () => {
              const d = document.createElement("div");
              d.className = "text-sm text-slate-200";
              d.innerHTML = `<div class="pb-2">Delete this line?</div><div class="text-slate-400">${clampText(line.text)}</div>`;
              showModal({
                title: "Delete line",
                bodyNode: d,
                okText: "Delete",
                cancelText: "Keep",
                onOk: async () => {
                  await jsonFetch(API.deleteHistoryLine, "POST", { session_id: sess.id, line_id: line.id });
                  // local update
                  const h = state.history.find(x => x.id === sess.id);
                  if (h) h.lines = (h.lines || []).filter(l => l.id !== line.id);
                  renderHistory();
                  toast("Line deleted");
                }
              });
            }
          });
          list.appendChild(makeLineRow({ text: line.text, buttons: [btnSpeak, btnEdit, btnDel] }));
        });

        box.appendChild(list);
      }

      root.appendChild(box);
    });
  }

  function updateCharCount() {
    $("charCount").textContent = String($("textInput").value.length);
  }

  $("textInput").addEventListener("input", updateCharCount);

  async function speakText(text, { source }) {
    const voice = $("voiceSelect").value;
    const full = (text ?? $("textInput").value).trim();
    if (!full) return toast("Type something first");

    // stop any existing playback
    stopPlayback(true);

    state.isPlaying = true;
    $("floatingStop").classList.remove("hidden");
    state.abortController = new AbortController();

    let completed = false;

    const onComplete = async () => {
      if (!state.isPlaying) return;
      completed = true;
      stopPlayback(false);

      // only log for main and log sources
      if (source === "main" || source === "log") {
        try {
          await jsonFetch(API.appendLine, "POST", { text: full, voice });
          // update local: dedupe and move to top
          const lines = state.last_session.lines || [];
          state.last_session.lines = lines.filter(l => clampText(l.text) !== clampText(full));
          state.last_session.lines.unshift({ id: `line_${Date.now()}`, text: full });
          renderSessionLog();
        } catch (e) {
          console.error(e);
        }
      }

      // persist voice on successful speak
      try { await jsonFetch(API.setVoice, "POST", { voice }); } catch {}
    };

    const onCancel = () => {
      stopPlayback(false);
      if (!completed) toast("Stopped");
    };

    state.player = new StreamingWavPlayer({ onComplete, onCancel });

    try {
      const formData = new FormData();
      formData.append("text", full);
      formData.append("voice_url", voice);

      const res = await fetch("/tts", {
        method: "POST",
        body: formData,
        signal: state.abortController.signal
      });
      if (!res.ok) throw new Error(`TTS error ${res.status}`);

      const reader = res.body.getReader();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (value && state.player) state.player.addChunk(value);
      }
      if (state.player) state.player.endStream();
    } catch (e) {
      if (e.name === "AbortError") return;
      console.error(e);
      stopPlayback(false);
      toast("Speak failed");
    }
  }

  function stopPlayback(interrupted) {
    if (state.abortController && interrupted) {
      try { state.abortController.abort(); } catch {}
    }
    if (state.player && interrupted) {
      try { state.player.stop(); } catch {}
    }
    state.abortController = null;
    state.player = null;
    state.isPlaying = false;
    $("floatingStop").classList.add("hidden");
  }

  $("floatingStop").addEventListener("click", () => stopPlayback(true));

  // Toolbar handlers
  $("btnSpeak").addEventListener("click", () => speakText(null, { source: "main" }));
  $("btnTag").addEventListener("click", addTagFromText);
  $("btnFav").addEventListener("click", () => addFavoriteFromText());

  $("btnClear").addEventListener("click", () => {
    $("textInput").value = "";
    updateCharCount();
    state.editingFavoriteId = null;
    state.editingFavoriteCategory = null;
    renderEditingHint();
    focusTextInput();
  });

  $("btnCopy").addEventListener("click", async () => {
    try { await clipboardWrite($("textInput").value); toast("Copied"); } catch { toast("Copy failed"); }
    focusTextInput();
  });

  $("btnPaste").addEventListener("click", async () => {
    try {
      const txt = await clipboardRead();
      $("textInput").value = txt;
      updateCharCount();
      toast("Pasted");
      focusTextInput();
    } catch { toast("Paste failed"); }
  });

  $("btnClearSession").addEventListener("click", async () => {
    await jsonFetch(API.clearSession, "POST", {});
    state.last_session.lines = [];
    state.last_session.name = "";
    $("sessionName").value = "";
    renderSessionLog();
    toast("Session cleared");
  });

  $("btnNewSession").addEventListener("click", async () => {
    await jsonFetch(API.newSession, "POST", {});
    state.last_session.lines = [];
    state.last_session.name = "";
    $("sessionName").value = "";
    state.editingFavoriteId = null;
    state.editingFavoriteCategory = null;
    renderEditingHint();
    renderSessionLog();
    toast("New session");
  });

  $("btnSaveSession").addEventListener("click", async () => {
    const name = $("sessionName").value.trim();
    const r = await jsonFetch(API.saveSession, "POST", { name });
    await loadState();
    state.historyExpanded = new Set([r.id]);
    toast("Session saved");
  });

  $("sessionName").addEventListener("change", async () => {
    const name = $("sessionName").value.trim();
    await jsonFetch(API.setSessionName, "POST", { name });
    state.last_session.name = name;
    toast("Saved");
  });

  $("voiceSelect").addEventListener("change", async () => {
    const voice = $("voiceSelect").value;
    try { await jsonFetch(API.setVoice, "POST", { voice }); } catch {}
  });

  window.addEventListener("load", async () => {
    setTab("chat");
    await loadVoices();
    await loadState();
    updateCharCount();
  });
</script>
</body>
</html>
